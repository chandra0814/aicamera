name: LensPilot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ai-fixtures:
    name: AI fixture validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON files
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory() && ![".git", "node_modules"].includes(entry.name)) return walk(full);
              return entry.isFile() && entry.name.endsWith(".json") ? [full] : [];
            });
          }

          for (const file of walk(process.cwd())) {
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(file);
          }
          NODE

      - name: Run AI core validation
        working-directory: shared/typescript
        run: npm run validate

      - name: Run backend creative API server validation
        working-directory: backend
        run: npm test

  creative-api-container:
    name: Creative API container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and smoke test deploy image
        shell: bash
        run: |
          set -euo pipefail

          docker build -t lenspilot-creative-api-ci ./backend

          container_name="lenspilot-creative-api-ci"
          rotated_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name "$container_name" \
            --publish 127.0.0.1:8787:8787 \
            --env OPENAI_API_KEY=ci-openai-placeholder \
            --env LENSPILOT_ALLOWED_ORIGINS=https://app.lenspilot.example \
            --env LENSPILOT_CREATIVE_API_TOKEN=ci-phone-token \
            --env LENSPILOT_CLIENT_SIGNING_SECRET=ci-phone-signing-secret \
            --env LENSPILOT_METRICS_TOKEN=ci-metrics-token \
            --env LENSPILOT_REQUIRE_PRODUCTION_SAFETY=true \
            --env LENSPILOT_REQUIRE_SIGNED_PHONE_REQUESTS=true \
            --env LENSPILOT_SECRET_ROTATION_MAX_AGE_DAYS=90 \
            --env LENSPILOT_OPENAI_KEY_ROTATED_AT="$rotated_at" \
            --env LENSPILOT_CREATIVE_API_TOKEN_ROTATED_AT="$rotated_at" \
            --env LENSPILOT_CLIENT_SIGNING_SECRET_ROTATED_AT="$rotated_at" \
            --env LENSPILOT_METRICS_TOKEN_ROTATED_AT="$rotated_at" \
            lenspilot-creative-api-ci

          for _ in {1..30}; do
            if node -e "fetch('http://127.0.0.1:8787/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1));"; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const baseURL = "http://127.0.0.1:8787";

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function fetchJSON(path, options = {}) {
            const response = await fetch(`${baseURL}${path}`, {
              headers: {
                accept: "application/json",
                ...options.headers,
              },
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          const health = await fetchJSON("/health");
          assert(health.response.status === 200, "Health endpoint should return 200.");
          assert(health.body?.service === "lenspilot-creative-api", "Health endpoint should identify the service.");
          assert(health.body?.privacy?.singlePhoneOnly === true, "Health privacy should report single-phone operation.");
          assert(health.body?.privacy?.acceptsClientOpenAIKey === false, "Health privacy should reject client OpenAI keys.");

          const ready = await fetchJSON("/ready");
          assert(ready.response.status === 200, "Ready endpoint should return 200 for protected CI config.");
          assert(ready.body?.status === "ready", "Ready endpoint should report ready.");
          assert(ready.body?.openAIConfigured === true, "Ready endpoint should report configured OpenAI state.");
          assert(ready.body?.clientAuthorizationConfigured === true, "Ready endpoint should report phone authorization.");
          assert(ready.body?.clientSignatureConfigured === true, "Ready endpoint should report phone request signing.");
          assert(ready.body?.signedRequestsRequired === true, "Ready endpoint should require signed phone requests.");
          assert(ready.body?.productionSafety?.ready === true, "Production safety should pass in the deploy container.");
          assert(ready.body?.secretRotation?.ready === true, "Secret rotation metadata should pass in the deploy container.");

          const unauthorizedMetrics = await fetchJSON("/metrics");
          assert(unauthorizedMetrics.response.status === 401, "Metrics should reject missing authorization.");

          const metrics = await fetchJSON("/metrics", {
            headers: {
              authorization: "Bearer ci-metrics-token",
            },
          });
          assert(metrics.response.status === 200, "Metrics should accept the configured token.");
          assert(metrics.body?.retention?.storesRawRequestBody === false, "Metrics must not store raw request bodies.");
          assert(metrics.body?.retention?.storesPromptText === false, "Metrics must not store prompt text.");
          assert(metrics.body?.retention?.storesAuthorizationHeader === false, "Metrics must not store auth headers.");
          assert(metrics.body?.privacy?.singlePhoneOnly === true, "Metrics privacy should report single-phone operation.");

          console.log(JSON.stringify({
            creativeApiContainerSmoke: true,
            health: health.response.status,
            ready: ready.response.status,
            metricsProtected: unauthorizedMetrics.response.status,
            metricsAuthorized: metrics.response.status,
            productionSafety: ready.body.productionSafety.ready,
            status: "passed",
          }, null, 2));
          NODE

  swift-package:
    name: Swift package tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests when package exists
        shell: bash
        run: |
          if [ -f ios/Package/Package.swift ]; then
            cd ios/Package
            swift test
          else
            echo "ios/Package/Package.swift not present; skipping Swift package tests."
          fi

  ios-app:
    name: iOS app build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create fixture iOS Creative API config
        working-directory: backend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync("/tmp/lenspilot-ci-production.env", [
            "OPENAI_API_KEY=sk-ci-never-export-this",
            "LENSPILOT_CREATIVE_API_URL=",
            "LENSPILOT_CREATIVE_API_TOKEN=lp_phone_ci_1234567890123456789012345678901234567890123",
            "LENSPILOT_CLIENT_SIGNING_SECRET=lp_signing_ci_1234567890123456789012345678901234567890123",
            "LENSPILOT_METRICS_TOKEN=lp_metrics_ci_1234567890123456789012345678901234567890123",
            "",
          ].join("\n"));
          NODE
          npm run ios-config:generate -- \
            --env-file /tmp/lenspilot-ci-production.env \
            --creative-api-url https://ci.lenspilot.example \
            --output ../ios/App/LensPilotApp/Config/LensPilotSecrets.generated.xcconfig
          if grep -E "OPENAI_API_KEY|sk-|LENSPILOT_METRICS_TOKEN|lp_metrics_" ../ios/App/LensPilotApp/Config/LensPilotSecrets.generated.xcconfig; then
            echo "Generated iOS config included a server-only secret."
            exit 1
          fi

      - name: Build LensPilot app target
        shell: bash
        run: |
          if [ -d ios/App/LensPilotApp/LensPilotApp.xcodeproj ]; then
            set +e
            xcodebuild \
              -project ios/App/LensPilotApp/LensPilotApp.xcodeproj \
              -scheme LensPilotApp \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee xcodebuild.log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::group::xcodebuild error summary"
              grep -n -E "error:|fatal error:|BUILD FAILED|Testing failed" xcodebuild.log || tail -200 xcodebuild.log
              echo "::endgroup::"
            fi
            exit "$status"
          else
            echo "LensPilotApp.xcodeproj not present; skipping iOS app build."
          fi

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ios-app-log
          path: xcodebuild.log
          if-no-files-found: ignore
