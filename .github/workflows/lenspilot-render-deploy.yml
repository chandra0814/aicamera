name: LensPilot Render Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenspilot-render-deploy
  cancel-in-progress: false

jobs:
  render-deploy:
    name: Deploy Creative API to Render
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required deployment secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          LENSPILOT_CREATIVE_API_URL: ${{ secrets.LENSPILOT_CREATIVE_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is required to trigger the Render deployment."
            exit 1
          fi

          if [ -z "$LENSPILOT_CREATIVE_API_URL" ]; then
            echo "LENSPILOT_CREATIVE_API_URL secret is required to verify the deployed backend."
            exit 1
          fi

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const hookURL = process.env.RENDER_DEPLOY_HOOK_URL;
          const response = await fetch(hookURL, {
            method: "POST",
          });
          const responseText = await response.text();
          const accepted = response.status === 200 || response.status === 201 || response.status === 202;
          if (!accepted) {
            console.error(JSON.stringify({
              renderDeployHook: true,
              status: "failed",
              httpStatus: response.status,
            }, null, 2));
            process.exit(1);
          }

          let deployId = null;
          try {
            const body = JSON.parse(responseText);
            deployId = body?.deploy?.id ?? body?.id ?? null;
          } catch {
            deployId = null;
          }

          console.log(JSON.stringify({
            renderDeployHook: true,
            status: "triggered",
            httpStatus: response.status,
            deployId,
          }, null, 2));
          NODE

      - name: Wait for deployed endpoint readiness
        working-directory: backend
        env:
          LENSPILOT_CREATIVE_API_URL: ${{ secrets.LENSPILOT_CREATIVE_API_URL }}
          LENSPILOT_METRICS_TOKEN: ${{ secrets.LENSPILOT_METRICS_TOKEN }}
          LENSPILOT_ENDPOINT_CHECK_TIMEOUT_MS: "30000"
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            echo "Production endpoint check attempt ${attempt}/30"
            if npm run check:production-endpoint; then
              exit 0
            fi
            sleep 20
          done

          echo "Production endpoint did not report ready after the Render deployment wait."
          exit 1
